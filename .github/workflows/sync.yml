name: Sync Upstream Source from AxionAOSP

on:
  schedule:
    - cron: '0 4 * * *' # Runs daily at 04:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  sync:
    name: Sync Source with upstream AxionAOSP
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: source
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add and fetch upstream
        run: |
          git remote add upstream https://github.com/AxionAOSP/android_packages_apps_AxionFx.git
          git fetch upstream lineage-23.2

      - name: Merge upstream changes into source
        run: |
          if git merge upstream/lineage-23.2 --ff-only; then
            echo "Fast-forward merge successful!"
            git push origin source
          else
            echo "Fast-forward not possible, merging with commit..."
            git merge upstream/lineage-23.2 -m "chore: sync upstream changes from AxionAOSP"
            git push origin source
          fi
